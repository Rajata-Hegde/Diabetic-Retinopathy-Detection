services:
  - type: web
    name: diabeyetic-backend
    env: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker main:app
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: diabeyetic-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0

databases:
  - name: diabeyetic-db
    plan: free
    region: ohio
